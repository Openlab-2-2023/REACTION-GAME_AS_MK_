<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <title>Leaderboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>🏆Leaderboard</h1>

  <div class="mode-section">
    <h2>🎯 Classic Mode</h2>
    <table>
      <thead>
        <tr>
          <th>Score</th>
          <th>Target Hits</th>
          <th>Miss</th>
          <th>Accuracy</th>
        </tr>
      </thead>
      <tbody id="leaderboard-classic"></tbody>
    </table>
  </div>

  <div class="mode-section">
    <h2>🧭 Tracking Mode</h2>
    <table>
      <thead>
        <tr>
          <th>Ranking</th>
          <th>Time on Ball (s)</th>
        </tr>
      </thead>
      <tbody id="leaderboard-tracking"></tbody>
    </table>
  </div>

  <div class="mode-section">
    <h2>⚡ Speed Mode</h2>
    <table>
      <thead>
        <tr>
          <th>Score</th>
          <th>Target Hits</th>
          <th>Miss</th>
          <th>Accuracy</th>
        </tr>
      </thead>
      <tbody id="leaderboard-speed"></tbody>
    </table>
  </div>

  <button class="btn" onclick="resetLeaderboard()">Reset Leaderboard</button>
  <a href="index.html"><button class="btn">Main Menu</button></a>

  <script>
    function loadLeaderboard(mode, elementId) {
      const data = JSON.parse(localStorage.getItem("leaderboard_" + mode)) || [];
      const tbody = document.getElementById(elementId);
      tbody.innerHTML = "";

      data.slice().reverse().forEach(entry => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${entry.score}</td>
          <td>${entry.hits}</td>
          <td>${entry.misses}</td>
          <td>${entry.accuracy}%</td>
        `;
        tbody.appendChild(row);
      });
    }

    function getRank(time) {
      if (time <= 0.2) return "TOP 1%";
      if (time <= 0.25) return "TOP 5%";
      if (time <= 0.3) return "TOP 10%";
      if (time <= 0.4) return "Above Average";
      if (time <= 0.5) return "Average";
      if (time <= 0.7) return "Below Average";
      return "Too slow";
    }

    function loadTrackingLeaderboard() {
      const data = JSON.parse(localStorage.getItem("leaderboard_tracking")) || [];
      const tbody = document.getElementById("leaderboard-tracking");
      tbody.innerHTML = "";

      data.slice().reverse().forEach(entry => {
        const rank = getRank(parseFloat(entry.holdTime));
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${rank}</td>
          <td>${entry.holdTime}</td>
        `;
        tbody.appendChild(row);
      });
    }

    function resetLeaderboard() {
      localStorage.clear();
      loadLeaderboard("classic", "leaderboard-classic");
      loadTrackingLeaderboard();
      loadLeaderboard("speed", "leaderboard-speed");
    }

    loadLeaderboard("classic", "leaderboard-classic");
    loadTrackingLeaderboard();
    loadLeaderboard("speed", "leaderboard-speed");
  </script>
</body>
</html>
