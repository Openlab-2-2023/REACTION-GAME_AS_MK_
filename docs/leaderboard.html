<!DOCTYPE html>
<html lang="sk">

<head>
  <meta charset="UTF-8" />
  <title>Leaderboard</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="leaderboard-wrapper">

  <h1>🏆 Leaderboard</h1>

  <!-- Classic Mode -->
  <div class="mode-section">
    <h2>🎯 Classic Mode</h2>
    <table>
      <thead>
        <tr>
          <th>Score</th>
          <th>Target Hits</th>
          <th>Miss</th>
          <th>Accuracy</th>
          <th>Difficulty</th>
        </tr>
      </thead>
      <tbody id="leaderboard-classic"></tbody>
    </table>
  </div>

  <!-- Tracking Mode -->
  <div class="mode-section">
    <h2>🧭 Tracking Mode</h2>
    <table>
      <thead>
        <tr>
          <th>Time on Ball (s)</th>
          <th>Rank</th>
        </tr>
      </thead>
      <tbody id="leaderboard-tracking"></tbody>
    </table>

  </div>

  <!-- Speed Mode -->
  <div class="mode-section">
    <h2>⚡ Speed Mode</h2>
    <table>
      <thead>
        <tr>
          <th>Time on Ball (s)</th>
          <th>Avg Hold Ratio</th>
        </tr>
      </thead>
      <tbody id="leaderboard-speed"></tbody>
    </table>
  </div>

  <!-- Buttons -->
  <button class="btn" onclick="resetLeaderboard()">Reset Leaderboard</button>
  <a href="index.html"><button class="btn">Main Menu</button></a>

  <!-- Leaderboard Script -->
  <script>
    function loadLeaderboard(mode, elementId) {
      const data = JSON.parse(localStorage.getItem("leaderboard_" + mode)) || [];
      const tbody = document.getElementById(elementId);
      tbody.innerHTML = "";

      data.slice().reverse().forEach(entry => {
        const row = document.createElement("tr");

        // For tracking and speed modes
        if (mode === "tracking" || mode === "speed") {
          const reactionTime = entry.holdTime || entry.reactionTime || "N/A";
          const rank = entry.averageHold || entry.rank || "N/A";

          row.innerHTML = `
            <td>${reactionTime}</td>
            <td>${rank}</td>
          `;
        }

        tbody.appendChild(row);
      });
    }

    function loadClassicLeaderboard() {
      const data = JSON.parse(localStorage.getItem("leaderboard_classic")) || [];
      const tbody = document.getElementById("leaderboard-classic");
      tbody.innerHTML = "";

      data.slice().reverse().forEach(entry => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${entry.score}</td>
          <td>${entry.hits}</td>
          <td>${entry.misses}</td>
          <td>${entry.accuracy}%</td>
          <td>${entry.mode || "?"}</td>
        `;
        tbody.appendChild(row);
      });
    }

    function resetLeaderboard() {
      localStorage.clear();
      loadClassicLeaderboard();
      loadLeaderboard("tracking", "leaderboard-tracking");
      loadLeaderboard("speed", "leaderboard-speed");
    }

    document.addEventListener("DOMContentLoaded", () => {
      loadClassicLeaderboard();
      loadLeaderboard("tracking", "leaderboard-tracking");
      loadLeaderboard("speed", "leaderboard-speed");
    });
  </script>
</body>

</html>
