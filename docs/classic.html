<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Classic Mode</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <h1>Classic Mode</h1>

  <div id="classic-menu">
    <button class="btn" onclick="startGame('easy')">Easy</button>
    <button class="btn" onclick="startGame('normal')">Normal</button>
    <button class="btn" onclick="startGame('hard')">Hard</button>
    <button class="btn" onclick="startGame('ultra-hard')">Ultra Hard</button>
    <a href="home_page.html"><button class="btn back">Back</button></a>
  </div>

  <div id="game-container" style="display: none;">
    <p id="score">Score: 0</p>
    <p id="timer">Time: 30s</p>
    <div id="game">
      <div id="target" class="target" onclick="increaseScore(event)"></div>
      <div id="fakeTarget" class="target fake" onclick="decreaseScore(event)"></div>
    </div>
    <button class="btn end" onclick="endGame()">End Game</button>
  </div>

  <div id="results-modal" class="modal">
    <div class="modal-content">
      <h2>Game Over!</h2>
      <p id="final-score"></p>
      <p id="total-clicks"></p>
      <p id="target-clicks"></p>
      <p id="missed-clicks"></p>
      <p id="accuracy"></p>
      <button class="btn" onclick="backToMenu()"> Menu</button>
      <button class="btn" onclick="restartGame()">Play again</button>
      <button class="btn" onclick="exitToGamemode()"> Modes</button>
    </div>
  </div>
</body>
</html>
