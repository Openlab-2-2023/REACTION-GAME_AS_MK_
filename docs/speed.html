<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reakčný Čas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Speed Mode</h1>

  <div id="reaction-box">
    <p id="instruction">Hold the button and wait for green signal !</p>

    <div class="lights">
      <div class="light" id="light-1"></div>
      <div class="light" id="light-2"></div>
      <div class="light" id="light-3"></div>
      <div class="light" id="light-4"></div>
      <div class="light" id="light-5"></div>
      <div class="light green" id="light-go"></div>
    </div>

    <button id="hold-button" class="btn">Hold</button>
  </div>

  <div id="results-modal" class="modal">
    <div class="modal-content">
      <h2 id="result-title"></h2>
      <p id="reaction-time"></p>
      <p id="rank"></p>
      <div class="modal-buttons">
        <button class="btn" onclick="backToMenu()">Main menu</button>
        <button class="btn" onclick="restartGame()">Play again</button>
        <button class="btn" onclick="exitToGamemode()">Game Modes</button>

      </div>
    </div>
  </div>

  <script src="speed.js"></script>
</body>
</html>
